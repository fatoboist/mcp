# Tests the Python MCP SDK samples against live Google MCP servers on pull
# requests and every night.
name: sdk-samples-python

on:
  pull_request:
    paths:
      - "sdk-samples/python/**"
      - ".github/workflows/sdk-samples-python.yml"
  schedule:
    # Every day at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Required to get an OIDC token for Workload Identity Federation.
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Pull requests from forks can't use the repository's credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk-samples/python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: google-github-actions/auth@v3
        with:
          # Set these repository variables after the test project is set up.
          workload_identity_provider: ${{ vars.SDK_SAMPLES_WIF_PROVIDER }}
          service_account: ${{ vars.SDK_SAMPLES_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.SDK_SAMPLES_PROJECT_ID }}
        run: pytest samples_test.py
